version: 2
# jsdom + canvas used by the JS/DOM test environment (package.json / package-lock.json).
# Scala/sbt and GitHub Action pins live in project/ZipxVersions.scala (zipx version-updates).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
